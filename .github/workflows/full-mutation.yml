name: Full mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths: &full-mutation-risk-paths
      - 'src/cache.ts'
      - 'src/crawler-utils.ts'
      - 'src/options.ts'
      - 'src/store.ts'
      - 'src/mcp-server.ts'
      - 'stryker.config.json'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.test.json'
      - 'scripts/run-mutation-shards.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/full-mutation.yml'
  push:
    branches:
      - main
    paths: *full-mutation-risk-paths

permissions:
  contents: read

concurrency:
  group: full-mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - json-content
          - json-schema-markdown
          - json-network
          - json-diagnostics
          - json-routing
          - core-cache
          - core-store-mcp
          - core-options-utils
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:shard -- full ${{ matrix.shard }}
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-full-${{ matrix.shard }}
          path: reports/mutation-shards/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: ${{ always() }}
    needs: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-full-*
          path: reports/mutation-shards
          merge-multiple: true
      - run: npm run test:mutation:aggregate -- full
