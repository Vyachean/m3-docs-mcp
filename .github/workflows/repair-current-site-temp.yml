name: Repair current Material site format

on:
  push:
    branches:
      - fix/m3-site-format-2026-08
    paths:
      - .github/workflows/repair-current-site-temp.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08

      - name: Apply current-site source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          replace_count('src/json-extraction/normalize-routes.ts', "export type NavigationSource = 'site-meta' | 'bundle-supplement';", "export type NavigationSource = 'site-meta' | 'sitemap' | 'rendered-nav' | 'bundle-supplement';", 1)
          replace_count('src/types.ts', "navigationSource?: 'site-meta' | 'bundle-supplement';", "navigationSource?: 'site-meta' | 'sitemap' | 'rendered-nav' | 'bundle-supplement';", 2)
          replace_count('src/crawler.ts', "navigationSource?: 'site-meta' | 'bundle-supplement';", "navigationSource?: 'site-meta' | 'sitemap' | 'rendered-nav' | 'bundle-supplement';", 1)

          p = Path('src/crawler.ts')
          lines = p.read_text().splitlines()
          fetch_log = next(i for i, line in enumerate(lines) if "logger?.log('error', 'site-meta:fetch-failed'" in line)
          if 'default update path requires site_meta' not in lines[fetch_log + 1]:
              raise SystemExit('crawler site-meta failure log shape changed')
          lines[fetch_log] = "        logger?.log('warn', 'site-meta:fetch-failed', { phase: 'fetch-site-meta', reason, isSiteMetaError, siteMetaFetched });"
          lines[fetch_log + 1] = "        logVerbose(`site_meta.js unavailable (${reason}); continuing with sitemap public-route discovery.`);"

          guard_start = next(i for i, line in enumerate(lines) if line.strip() == 'const siteMetaProvidedRoutes = normalizedSiteMetaRoutes.length > 0;')
          guard_end = next(i for i in range(guard_start, len(lines)) if lines[i].lstrip().startswith('// page-reference-resolver'))
          guard = [
              '    const siteMetaProvidedRoutes = normalizedSiteMetaRoutes.length > 0;',
              '    const sitemapProvidedRoutes = sitemapPublicDocPaths.size > 0;',
              '    const browserFallbackAllowed = options.allowBrowserFallback === true;',
              '',
              '    if (!siteMetaProvidedRoutes && !sitemapProvidedRoutes && !browserFallbackAllowed) {',
              '      // A deterministic refresh needs public-route discovery independent from the bundle.',
              '      // Current Material publishes that boundary through sitemap.xml; older snapshots may',
              '      // still provide site_meta.js. The bundle alone never proves that a route is public.',
              "      const reason = 'neither site_meta.js nor sitemap.xml provided usable public routes';",
              "      logger?.log('error', 'route-discovery:rejected', {",
              "        phase: 'fetch-site-meta',",
              '        reason,',
              '        siteMetaFetched,',
              '        siteMetaFailed,',
              '        sitemapRouteCount: sitemapPublicDocPaths.size',
              '      });',
              '      await logger?.writeIntermediateDiagnostics({',
              "        promotionDecision: 'pending',",
              '        startedAt,',
              '        siteMetaFetched,',
              '        siteMetaFailed,',
              '        bundleDiscoveryFailed,',
              '        directJsonEnabled: false,',
              '        directJsonDisabledReason: reason,',
              '        dsdbConfigSource: null,',
              '        networkRecoveryAttempted: false,',
              '        networkRecoverySucceeded: false',
              '      });',
              '      throw new Error(`No usable public route discovery source (${reason}); refusing to use the bundle table as an uncorroborated full route source.`);',
              '    }',
              '',
          ]
          lines[guard_start:guard_end] = guard
          p.write_text('\n'.join(lines) + '\n')

          p = Path('src/crawler.ts')
          text = p.read_text()
          old_nav = "route.sources.includes('site_meta') ? 'site-meta' : 'bundle-supplement'"
          new_nav = "route.sources.includes('site_meta') ? 'site-meta' : route.sources.includes('sitemap') ? 'sitemap' : route.sources.includes('rendered_nav') ? 'rendered-nav' : 'bundle-supplement'"
          if text.count(old_nav) != 5:
              raise SystemExit(f'crawler navigation-source expression count={text.count(old_nav)}')
          text = text.replace(old_nav, new_nav)
          old_supplement = "route.sources.includes('bundle') && !route.sources.includes('site_meta')"
          new_supplement = "route.sources.includes('bundle') && !route.sources.includes('site_meta') && !route.sources.includes('sitemap') && !route.sources.includes('rendered_nav')"
          if text.count(old_supplement) != 1:
              raise SystemExit(f'crawler bundle-supplement count expression count={text.count(old_supplement)}')
          text = text.replace(old_supplement, new_supplement)
          old_prefix = "route.sources.includes('bundle') && (route.route === `/${prefix}` || route.route.startsWith(`/${prefix}/`))"
          new_prefix = "route.sources.includes('bundle') && !route.sources.includes('site_meta') && !route.sources.includes('sitemap') && !route.sources.includes('rendered_nav') && (route.route === `/${prefix}` || route.route.startsWith(`/${prefix}/`))"
          if text.count(old_prefix) != 1:
              raise SystemExit(f'crawler supplemented-prefix expression count={text.count(old_prefix)}')
          p.write_text(text.replace(old_prefix, new_prefix))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for full verification
        run: npx playwright install --with-deps chromium

      - name: Verify live full cache refresh
        run: npm run verify:cache:full

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/crawler.ts src/types.ts src/json-extraction/normalize-routes.ts
          git commit -m "fix: use sitemap for current Material route discovery"
          git push origin HEAD:fix/m3-site-format-2026-08
