name: Inspect current Material bundle references

on: [push]

jobs:
  inspect-live-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08
      - run: npm ci
      - run: node scripts/inspect-current-bundle-temp.mjs
