name: Repair current Material quality formats

on: [push]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08
      - name: Apply focused source fixes
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/json-extraction/extract-content-page.ts"); s=p.read_text(); old="  pageDiagnostic.unknownChunkTypes.push(chunkType);"; new="  if (chunkType === \"EMPTY\") return \"\";\n\n  pageDiagnostic.unknownChunkTypes.push(chunkType);"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/json-extraction/fetch-json-page.ts"); s=p.read_text(); old="    resourceType === \"TOKEN_TABLE\" && lastSegment ? `${dsdbBase}/TOKEN_TABLE.${lastSegment}.json` : null,"; new=old+"\n    resourceType === \"TYPOGRAPHY\" && lastSegment ? `${dsdbBase}/TYPOGRAPHY.${lastSegment}.json` : null,"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/json-extraction/extract-dsdb-resource.ts"); s=p.read_text(); old="  if (libraryModuleType !== \"TOKEN_TABLE\") {"; new="  if (libraryModuleType !== \"TOKEN_TABLE\" && libraryModuleType !== \"TYPOGRAPHY\") {"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/json-extraction/extract-dsdb-resource.ts"); s=p.read_text(); old="function extractTokenTableSystem(resource: unknown): TokenTableSystem | null {"; new=old+"\n  const root = parseTokenTableSystem(resource);\n  if (root) return root;"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit verified source fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/json-extraction/extract-content-page.ts src/json-extraction/extract-dsdb-resource.ts src/json-extraction/fetch-json-page.ts
          git commit -m "fix: support current empty and typography content"
          git push origin HEAD:fix/m3-site-format-2026-08
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:cache:full
