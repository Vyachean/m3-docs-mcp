name: Repair current Material site format

on:
  push:
    branches:
      - fix/m3-site-format-2026-08
    paths:
      - .github/workflows/repair-current-site-temp.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08

      - name: Preserve legacy subtree supplement contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/json-extraction/route-graph.ts',
              '  allowUncorroboratedBundleRoutes?: boolean;\n}): RoutePlanSummary {',
              '  allowUncorroboratedBundleRoutes?: boolean;\n  allowedBundleSupplementPrefixes?: string[];\n}): RoutePlanSummary {'
          )
          replace_once(
              'src/json-extraction/route-graph.ts',
              '  const { baseUrl, includeBlog, siteMeta, normalizedSiteMetaRoutes, bundleRoutes, sitemapPaths, renderedNavPaths = [], allowUncorroboratedBundleRoutes = false } = params;',
              '  const { baseUrl, includeBlog, siteMeta, normalizedSiteMetaRoutes, bundleRoutes, sitemapPaths, renderedNavPaths = [], allowUncorroboratedBundleRoutes = false, allowedBundleSupplementPrefixes = [] } = params;'
          )
          replace_once(
              'src/json-extraction/route-graph.ts',
              '      publicCorroborated: allowUncorroboratedBundleRoutes,',
              "      publicCorroborated: allowUncorroboratedBundleRoutes || allowedBundleSupplementPrefixes.some((prefix) => normalizeRoute(entry.slug) === `/${prefix}` || normalizeRoute(entry.slug).startsWith(`/${prefix}/`)),"
          )
          replace_once(
              'src/crawler.ts',
              '        renderedNavPaths: Array.from(renderedNavPublicDocPaths),\n        allowUncorroboratedBundleRoutes: browserFallbackAllowed\n',
              "        renderedNavPaths: Array.from(renderedNavPublicDocPaths),\n        allowUncorroboratedBundleRoutes: browserFallbackAllowed,\n        allowedBundleSupplementPrefixes: siteMetaProvidedRoutes\n          ? findSubtreesWithoutCoverage(normalizedSiteMetaRoutes.map((route) => route.path), ['components', 'styles', 'foundations'])\n          : []\n"
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/crawler.ts src/json-extraction/route-graph.ts
          git commit -m "fix: preserve scoped bundle subtree supplements"
          git push origin HEAD:fix/m3-site-format-2026-08

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for full verification
        run: npx playwright install --with-deps chromium

      - name: Verify live full cache refresh
        run: npm run verify:cache:full
