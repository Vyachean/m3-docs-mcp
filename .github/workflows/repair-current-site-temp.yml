name: Repair current Material quality formats

on:
  push:
    branches:
      - fix/m3-site-format-2026-08
    paths:
      - .github/workflows/repair-current-site-temp.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08
      - name: Apply format fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))
          replace_once('src/json-extraction/extract-content-page.ts', "  if (chunkType === 'RESOURCE') {\n    return renderDsdbResourceChunk(decodeResourceChunk(chunk), fetchResource, pageDiagnostic, collectedTokenTables);\n  }\n\n  pageDiagnostic.unknownChunkTypes.push(chunkType);", "  if (chunkType === 'RESOURCE') {\n    return renderDsdbResourceChunk(decodeResourceChunk(chunk), fetchResource, pageDiagnostic, collectedTokenTables);\n  }\n\n  // Current Material catalog pages use explicit EMPTY spacer chunks. They intentionally carry\n  // no content and are not extraction failures or unresolved resources.\n  if (chunkType === 'EMPTY') return '';\n\n  pageDiagnostic.unknownChunkTypes.push(chunkType);")
          replace_once('src/json-extraction/fetch-json-page.ts', "    resourceType === 'TOKEN_TABLE' && lastSegment ? `${dsdbBase}/TOKEN_TABLE.${lastSegment}.json` : null,\n    toGenericDsdbFilenameCandidate(dsdbBase, normalized),", "    resourceType === 'TOKEN_TABLE' && lastSegment ? `${dsdbBase}/TOKEN_TABLE.${lastSegment}.json` : null,\n    resourceType === 'TYPOGRAPHY' && lastSegment ? `${dsdbBase}/TYPOGRAPHY.${lastSegment}.json` : null,\n    toGenericDsdbFilenameCandidate(dsdbBase, normalized),")
          replace_once('src/json-extraction/extract-dsdb-resource.ts', "  if (libraryModuleType !== 'TOKEN_TABLE') {", "  if (libraryModuleType !== 'TOKEN_TABLE' && libraryModuleType !== 'TYPOGRAPHY') {")
          p = Path('src/json-extraction/extract-dsdb-resource.ts')
          text = p.read_text()
          marker = "function extractTokenTableSystem(resource: unknown): TokenTableSystem | null {\n"
          if text.count(marker) != 1:
              raise SystemExit('extractTokenTableSystem marker changed')
          text = text.replace(marker, marker + "  const root = parseTokenTableSystem(resource);\n  if (root) return root;\n", 1)
          start = text.index('  pageDiagnostic.tokenTables += 1;')
          text = text[:start] + text[start:].replace("renderResourcePlaceholder('TOKEN_TABLE'", 'renderResourcePlaceholder(libraryModuleType')
          p.write_text(text)
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit verified source fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/json-extraction/extract-content-page.ts src/json-extraction/extract-dsdb-resource.ts src/json-extraction/fetch-json-page.ts
          git commit -m "fix: support current empty and typography content"
          git push origin HEAD:fix/m3-site-format-2026-08
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:cache:full
