name: Inspect current Material route format

on:
  push:
    branches:
      - fix/m3-site-format-2026-08
    paths:
      - .github/workflows/repair-current-site-temp.yml

jobs:
  inspect-live-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08
      - run: npm ci
      - name: Inspect live bundle and sitemap
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { fetchAngularBundleText, extractBundleRouteTable } from './dist/json-extraction/page-reference-resolver.js';

          const baseUrl = 'https://m3.material.io';
          const bundleText = await fetchAngularBundleText(baseUrl);
          const routes = extractBundleRouteTable(bundleText);
          const sitemapText = await (await fetch(`${baseUrl}/sitemap.xml`)).text();
          const sitemapPaths = Array.from(sitemapText.matchAll(/<loc>([^<]+)<\/loc>/g), (m) => new URL(m[1]).pathname);
          const docs = sitemapPaths.filter((path) => path.startsWith('/components') || path.startsWith('/styles') || path.startsWith('/foundations') || path.startsWith('/develop'));

          console.log('bundle route count', routes.length);
          console.log('sitemap doc count', docs.length);
          for (const prefix of ['components', 'styles', 'foundations', 'develop']) {
            console.log(`\n=== BUNDLE ${prefix} ===`);
            for (const route of routes.filter((entry) => entry.slug === prefix || entry.slug.startsWith(`${prefix}/`)).slice(0, 80)) {
              console.log(JSON.stringify({ slug: route.slug, collectionId: route.collectionId, documentId: route.documentId, tabs: route.tabs, alternateSlugs: route.alternateSlugs }));
            }
            console.log(`=== SITEMAP ${prefix} ===`);
            console.log(docs.filter((path) => path === `/${prefix}` || path.startsWith(`/${prefix}/`)).slice(0, 120).join('\n'));
          }

          for (const slug of ['components/buttons','components/switch','components/lists','components/segmented-buttons','styles/color','foundations/layout','develop']) {
            console.log(`\nLOOKUP ${slug}`, JSON.stringify(routes.find((entry) => entry.slug === slug) ?? null));
          }
          NODE
