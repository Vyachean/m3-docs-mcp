name: Capture current Material extraction diagnostics

on:
  push:
    branches:
      - fix/m3-site-format-2026-08
    paths:
      - .github/workflows/repair-current-site-temp.yml

jobs:
  capture-live-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08
      - run: npm ci
      - run: npm run build
      - name: Run current full extraction
        continue-on-error: true
        run: node dist/index.js update --cache-dir /tmp/m3-inspect --min-pages 10 --concurrency 8 --strict-graph --verbose
      - name: Pack failed staging diagnostics
        if: always()
        run: |
          if [ -d /tmp/m3-inspect.failed-staging ]; then
            tar -C /tmp -czf /tmp/m3-inspect-diagnostics.tar.gz m3-inspect.failed-staging
          elif [ -d /tmp/m3-inspect ]; then
            tar -C /tmp -czf /tmp/m3-inspect-diagnostics.tar.gz m3-inspect
          else
            echo "No cache directory was produced" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-material-extraction-diagnostics
          path: /tmp/m3-inspect-diagnostics.tar.gz
          retention-days: 1
