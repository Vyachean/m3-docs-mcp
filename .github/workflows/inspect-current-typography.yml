name: Inspect current typography payload

on:
  push:
    branches:
      - fix/typography-token-values

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Vyachean/m3-docs-cache
          ref: main
          path: cache

      - name: Print selected current typography values
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'cache/raw/dsdb/2026-08-12_10-00-15/20543ce18892f7d9.json';
          const raw = JSON.parse(fs.readFileSync(path, 'utf8'));
          const wanted = new Set([
            'md.sys.typescale.display-large.tracking',
            'md.sys.typescale.emphasized.display-small.tracking',
            'md.ref.typeface.variable.wght-medium',
            'md.ref.typeface.emphasized.rond',
          ]);

          function visit(value) {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (typeof value.tokenName === 'string' && wanted.has(value.tokenName)) {
              console.log(`FOUND TOKEN ${value.tokenName}`);
              console.log(JSON.stringify(value, null, 2));
            }
            for (const child of Object.values(value)) visit(child);
          }

          visit(raw);

          const system = raw.system ?? raw;
          for (const [key, tree] of Object.entries(system.contextualReferenceTrees ?? {})) {
            const token = (system.tokens ?? []).find((candidate) => candidate?.name === key);
            if (token?.tokenName && wanted.has(token.tokenName)) {
              console.log(`CONTEXT TREE ${token.tokenName}`);
              console.log(JSON.stringify(tree, null, 2));
            }
          }
          NODE
