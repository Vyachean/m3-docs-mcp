name: Apply typography token fix

on:
  push:
    branches:
      - fix/typography-token-values

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typography-token-values

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected source block not found in ${file}`);
            fs.writeFileSync(file, source.replace(before, after));
          }

          replaceExact(
            'src/graph/token-table-graph.ts',
            `function formatResolvedValue(resolvedValue: Record<string, unknown>): string | null {\n  if (!resolvedValue || resolvedValue['undefined'] === true) return null;\n  const formatted = Object.entries(resolvedValue)\n    .filter(([key]) => key !== 'undefined')\n    .map(([, value]) => formatValueNode(value))\n    .filter(Boolean)\n    .join(' ');\n  return formatted || null;\n}`,
            `function formatAxisValueNode(value: unknown): string {\n  if (!isRecord(value) || typeof value['tag'] !== 'string') return '';\n  if (!Object.keys(value).every((key) => key === 'tag' || key === 'value')) return '';\n  const axisValue = value['value'];\n  if (axisValue != null && (typeof axisValue !== 'number' || !Number.isFinite(axisValue))) return '';\n  return JSON.stringify(axisValue == null ? { tag: value['tag'] } : { tag: value['tag'], value: axisValue });\n}\n\nfunction formatResolvedValue(resolvedValue: Record<string, unknown>, tokenValueType: string): string | null {\n  if (!resolvedValue || resolvedValue['undefined'] === true) return null;\n  const formatted = Object.entries(resolvedValue)\n    .filter(([key]) => key !== 'undefined')\n    .map(([, value]) => tokenValueType === 'AXIS_VALUE' ? formatAxisValueNode(value) : formatValueNode(value))\n    .filter(Boolean)\n    .join(' ');\n  return formatted || null;\n}`,
          );

          replaceExact(
            'src/graph/token-table-graph.ts',
            `function classifyUnresolvedReason(\n  entries: DecodedContextTreeEntry[],\n  entry: DecodedContextTreeEntry | undefined,\n): UnresolvedReason {`,
            `function classifyUnresolvedReason(\n  entries: DecodedContextTreeEntry[],\n  entry: DecodedContextTreeEntry | undefined,\n  tokenValueType: string,\n): UnresolvedReason {`,
          );
          replaceExact(
            'src/graph/token-table-graph.ts',
            `  if (entry.resolvedValue['undefined'] === true) return 'upstream-empty';\n  const meaningfulKeys = Object.keys(entry.resolvedValue).filter((k) => k !== 'undefined');`,
            `  if (entry.resolvedValue['undefined'] === true) return 'upstream-empty';\n  const fontTracking = entry.resolvedValue['fontTracking'];\n  if (\n    tokenValueType === 'FONT_TRACKING' &&\n    isRecord(fontTracking) &&\n    Object.keys(fontTracking).length === 0\n  ) return 'upstream-empty';\n  const meaningfulKeys = Object.keys(entry.resolvedValue).filter((k) => k !== 'undefined');`,
          );

          replaceExact(
            'src/graph/token-table-graph.ts',
            `function buildTokenValues(\n  entries: DecodedContextTreeEntry[],\n  idx: TagIndex\n): { values: TokenValueEntry[]; aliases: string[]; unresolved: boolean } {`,
            `function buildTokenValues(\n  entries: DecodedContextTreeEntry[],\n  idx: TagIndex,\n  tokenValueType: string,\n): { values: TokenValueEntry[]; aliases: string[]; unresolved: boolean } {`,
          );
          replaceExact(
            'src/graph/token-table-graph.ts',
            `        const reason = classifyUnresolvedReason(entries, undefined);`,
            `        const reason = classifyUnresolvedReason(entries, undefined, tokenValueType);`,
          );
          replaceExact(
            'src/graph/token-table-graph.ts',
            `    const value = formatResolvedValue(entry.resolvedValue);`,
            `    const value = formatResolvedValue(entry.resolvedValue, tokenValueType);`,
          );
          replaceExact(
            'src/graph/token-table-graph.ts',
            `      const reason = classifyUnresolvedReason(entries, entry);`,
            `      const reason = classifyUnresolvedReason(entries, entry, tokenValueType);`,
          );
          replaceExact(
            'src/graph/token-table-graph.ts',
            `      const { values, aliases, unresolved } = buildTokenValues(entries, idx);`,
            `      const { values, aliases, unresolved } = buildTokenValues(entries, idx, token.tokenValueType);`,
          );

          replaceExact(
            'src/json-extraction/render-markdown.ts',
            `function formatResolvedValue(rv: Record<string, unknown>): string {\n  if (!rv || rv['undefined'] === true) return '';\n  const formatted = Object.entries(rv)\n    .filter(([key]) => key !== 'undefined')\n    .map(([, value]) => formatValueNode(value))\n    .filter(Boolean)\n    .join(' ');\n  return formatted || '[unresolved]';\n}`,
            `function formatFontTrackingValue(value: unknown): string {\n  if (!isNonArrayObject(value) || typeof value.unit !== 'string') return '';\n  if (!Object.keys(value).every((key) => key === 'unit' || key === 'value')) return '';\n  if (value.value != null && (typeof value.value !== 'number' || !Number.isFinite(value.value))) return '';\n  const numericValue = value.value == null ? 0 : value.value;\n  return \`${'${numericValue}'}${'${normalizeUnit(value.unit)}'}\`;\n}\n\nfunction formatResolvedValue(rv: Record<string, unknown>, tokenValueType: string): string {\n  if (!rv || rv['undefined'] === true) return '';\n  const formatted = Object.entries(rv)\n    .filter(([key]) => key !== 'undefined')\n    .map(([key, value]) => tokenValueType === 'FONT_TRACKING' && key === 'fontTracking'\n      ? formatFontTrackingValue(value)\n      : formatValueNode(value))\n    .filter(Boolean)\n    .join(' ');\n  return formatted || '[unresolved]';\n}`,
          );
          replaceExact(
            'src/json-extraction/render-markdown.ts',
            `        lightEntry ? formatResolvedValue(lightEntry.resolvedValue) : '[unresolved]',\n        darkEntry ? formatResolvedValue(darkEntry.resolvedValue) : '[unresolved]',\n        lightHcEntry ? formatResolvedValue(lightHcEntry.resolvedValue) : '',\n        darkHcEntry ? formatResolvedValue(darkHcEntry.resolvedValue) : ''`,
            `        lightEntry ? formatResolvedValue(lightEntry.resolvedValue, token.tokenValueType) : '[unresolved]',\n        darkEntry ? formatResolvedValue(darkEntry.resolvedValue, token.tokenValueType) : '[unresolved]',\n        lightHcEntry ? formatResolvedValue(lightHcEntry.resolvedValue, token.tokenValueType) : '',\n        darkHcEntry ? formatResolvedValue(darkHcEntry.resolvedValue, token.tokenValueType) : ''`,
          );

          replaceExact(
            'src/validation/validate-structured-graph.ts',
            `  const reasons: string[] = [];\n  const resourceById = new Map(resourceGraph.resources.map((resource) => [resource.resourceId, resource]));\n  const tokenTableById = new Map(tokenTableGraph.tokenTables.map((tokenTable) => [tokenTable.resourceId, tokenTable]));`,
            `  const reasons: string[] = [];\n  const resourceById = new Map(resourceGraph.resources.map((resource) => [resource.resourceId, resource]));\n  const tokenTableById = new Map(tokenTableGraph.tokenTables.map((tokenTable) => [tokenTable.resourceId, tokenTable]));\n  const blockingTokenValueReasons = new Set<string>([\n    'missing-alias-target',\n    'unsupported-value-type',\n    'parser-bug',\n    'unclassified',\n  ]);\n  const blockingTokenValues: string[] = [];\n  for (const tokenTable of tokenTableGraph.tokenTables) {\n    for (const tokenSet of tokenTable.tokenSets) {\n      for (const token of tokenSet.tokens) {\n        for (const value of token.values) {\n          if (value.resolved || !value.unresolvedReason || !blockingTokenValueReasons.has(value.unresolvedReason)) continue;\n          blockingTokenValues.push(\`${'${token.tokenName}'}:${'${value.role}'}:${'${value.unresolvedReason}'}\`);\n        }\n      }\n    }\n  }\n  if (blockingTokenValues.length > 0) {\n    const sample = blockingTokenValues.slice(0, 10).join(', ');\n    reasons.push(\n      \`Token-table graph contains ${'${blockingTokenValues.length}'} parser/integrity unresolved value(s): ${'${sample}'}${'${blockingTokenValues.length > 10 ? `, and ${blockingTokenValues.length - 10} more` : ""}'}.\`\n    );\n  }`,
          );

          replaceExact(
            'tests/validate-structured-graph.test.ts',
            `  it('does not fail only because a token table reports unresolved token variants on a required route', async () => {\n    await writeResourceGraph(makeResourceGraph(), cacheDir);\n    await writeTokenTableGraph(makeTokenTableGraph({\n      tokenTables: [{\n        resourceId: 'token-table:md.comp.switch',\n        resourceName: 'md.comp.switch',\n        requestedTokenSets: ['md.comp.switch.selected'],\n        tokenSets: [],\n        routes: ['/components/switch/overview'],\n        unresolvedTokenCount: 3,\n      }],\n    }), cacheDir);\n    const result = await validateStructuredGraph({ cacheDir, requiredRoutes: REQUIRED_ROUTES });\n    expect(result.passed).toBe(true);\n    expect(result.reasons).toEqual([]);\n  });`,
            `  it('does not fail only because a token table reports unresolved token variants on a required route', async () => {\n    await writeResourceGraph(makeResourceGraph(), cacheDir);\n    await writeTokenTableGraph(makeTokenTableGraph({\n      tokenTables: [{\n        resourceId: 'token-table:md.comp.switch',\n        resourceName: 'md.comp.switch',\n        requestedTokenSets: ['md.comp.switch.selected'],\n        tokenSets: [],\n        routes: ['/components/switch/overview'],\n        unresolvedTokenCount: 3,\n      }],\n    }), cacheDir);\n    const result = await validateStructuredGraph({ cacheDir, requiredRoutes: REQUIRED_ROUTES });\n    expect(result.passed).toBe(true);\n    expect(result.reasons).toEqual([]);\n  });\n\n  it('allows token values that are intentionally absent upstream', async () => {\n    await writeResourceGraph(makeResourceGraph(), cacheDir);\n    await writeTokenTableGraph(makeTokenTableGraph({\n      tokenTables: [{\n        resourceId: 'token-table:md.comp.switch',\n        resourceName: 'md.comp.switch',\n        requestedTokenSets: ['md.comp.switch.selected'],\n        tokenSets: [{\n          tokenSetName: 'md.comp.switch.selected',\n          displayName: 'Selected',\n          tokens: [{\n            tokenName: 'md.comp.switch.optional',\n            displayName: 'Optional',\n            aliases: [],\n            values: [{ role: 'light', value: null, resolved: false, unresolvedReason: 'upstream-empty' }],\n          }],\n        }],\n        routes: ['/components/switch/overview'],\n        unresolvedTokenCount: 1,\n      }],\n    }), cacheDir);\n    const result = await validateStructuredGraph({ cacheDir, requiredRoutes: REQUIRED_ROUTES });\n    expect(result.passed).toBe(true);\n  });\n\n  it('fails on token values the parser cannot represent', async () => {\n    await writeResourceGraph(makeResourceGraph(), cacheDir);\n    await writeTokenTableGraph(makeTokenTableGraph({\n      tokenTables: [{\n        resourceId: 'token-table:typography',\n        resourceName: 'typography',\n        requestedTokenSets: ['Type scale'],\n        tokenSets: [{\n          tokenSetName: 'md.ref.typeface',\n          displayName: 'Type scale',\n          tokens: [{\n            tokenName: 'md.ref.typeface.variable.wght-medium',\n            displayName: 'Variable medium wght',\n            aliases: [],\n            values: [{ role: 'light', value: null, resolved: false, unresolvedReason: 'unsupported-value-type' }],\n          }],\n        }],\n        routes: ['/styles/typography/type-scale-tokens'],\n        unresolvedTokenCount: 1,\n      }],\n    }), cacheDir);\n    const result = await validateStructuredGraph({ cacheDir, requiredRoutes: REQUIRED_ROUTES });\n    expect(result.passed).toBe(false);\n    expect(result.reasons.some((reason) => reason.includes('unsupported-value-type'))).toBe(true);\n  });`,
          );
          NODE

      - run: npm ci
      - run: npx vitest run tests/typography-token-quality.test.ts tests/validate-structured-graph.test.ts tests/json-extraction.test.ts tests/token-resolution-classify.test.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:cache:full

      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/graph/token-table-graph.ts src/json-extraction/render-markdown.ts src/validation/validate-structured-graph.ts tests/validate-structured-graph.test.ts
          git diff --cached --check
          git commit -m "fix: preserve current typography token values"
          git push origin HEAD:fix/typography-token-values
