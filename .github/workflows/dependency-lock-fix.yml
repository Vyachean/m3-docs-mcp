name: Dependency lock security refresh

on:
  push:
    branches:
      - audit/dependency-security

permissions:
  contents: write

concurrency:
  group: dependency-lock-security-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/dependency-security
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Refresh vulnerable transitive versions within existing ranges
        run: npm audit fix --package-lock-only
      - run: npm ci
      - name: Require clean runtime audit
        run: npm audit --omit=dev --audit-level=low
      - name: Require clean full audit
        run: npm audit --audit-level=low
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit verified lockfile only
        shell: bash
        run: |
          rm -f .github/workflows/dependency-audit.yml .github/workflows/dependency-lock-fix.yml
          if ! git diff --quiet -- package.json; then
            echo 'package.json changed unexpectedly' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/dependency-audit.yml .github/workflows/dependency-lock-fix.yml
          git commit -m "chore: refresh vulnerable dependency locks"
          git push origin HEAD:audit/dependency-security
