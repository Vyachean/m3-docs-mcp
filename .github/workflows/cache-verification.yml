name: Cache verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/cache.ts'
      - 'src/crawler.ts'
      - 'src/crawler-utils.ts'
      - 'src/options.ts'
      - 'src/store.ts'
      - 'src/mcp-server.ts'
      - 'src/types.ts'
      - 'src/json-extraction/**'
      - 'src/raw-artifacts/**'
      - 'src/graph/**'
      - 'src/validation/**'
      - 'src/manifest.ts'
      - 'src/markdown-renderer.ts'
      - 'scripts/verify-full-cache-refresh.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cache-verification.yml'
  push:
    branches:
      - main
    paths:
      - 'src/cache.ts'
      - 'src/crawler.ts'
      - 'src/crawler-utils.ts'
      - 'src/options.ts'
      - 'src/store.ts'
      - 'src/mcp-server.ts'
      - 'src/types.ts'
      - 'src/json-extraction/**'
      - 'src/raw-artifacts/**'
      - 'src/graph/**'
      - 'src/validation/**'
      - 'src/manifest.ts'
      - 'src/markdown-renderer.ts'
      - 'scripts/verify-full-cache-refresh.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cache-verification.yml'

permissions:
  contents: read

concurrency:
  group: cache-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:cache:full
