name: Verify manifest count consistency

on:
  push:
    branches:
      - fix/manifest-count-consistency
    paths:
      - .github/workflows/verify-manifest-count-consistency.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/manifest-count-consistency
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static and type checks
        run: npm run check

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for strict browser oracle
        run: npx playwright install --with-deps chromium

      - name: Full production-style cache verification
        run: npm run verify:cache:full

      - name: Remove temporary verification workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/verify-manifest-count-consistency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-manifest-count-consistency.yml
          git commit -m "chore: remove temporary manifest verification workflow"
          git push origin HEAD:fix/manifest-count-consistency
