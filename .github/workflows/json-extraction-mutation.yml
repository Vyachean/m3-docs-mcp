name: JSON extraction mutation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/json-extraction/**'
      - 'stryker-json-extraction.config.json'
      - 'scripts/run-mutation-shards.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/json-extraction-mutation.yml'
  push:
    branches:
      - main
    paths:
      - 'src/json-extraction/**'
      - 'stryker-json-extraction.config.json'
      - 'scripts/run-mutation-shards.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/json-extraction-mutation.yml'

permissions:
  contents: read

concurrency:
  group: json-extraction-mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:json-extraction
