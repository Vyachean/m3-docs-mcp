name: Verify final current Material format fix

on:
  push:
    branches:
      - fix/m3-site-format-2026-08-v2

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3-site-format-2026-08-v2
      - name: Treat EMPTY chunks as no-op
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/json-extraction/extract-content-page.ts')
          text = p.read_text()
          old = "  pageDiagnostic.unknownChunkTypes.push(chunkType);"
          new = "  if (chunkType === 'EMPTY') return '';\n\n  pageDiagnostic.unknownChunkTypes.push(chunkType);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one unknown-chunk marker, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit verified source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/json-extraction/extract-content-page.ts
          git commit -m "fix: treat empty content chunks as no-op"
          git push origin HEAD:fix/m3-site-format-2026-08-v2
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:cache:full
