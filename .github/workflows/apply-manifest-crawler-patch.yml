name: Apply manifest crawler patch

on:
  push:
    branches:
      - fix/manifest-count-consistency
    paths:
      - .github/workflows/apply-manifest-crawler-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/manifest-count-consistency
          fetch-depth: 0

      - name: Apply exact crawler replacements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/crawler.ts')
          text = path.read_text()

          old_import = "import { createCacheManifest, writeManifest, type ManifestHealthSummary } from './manifest.js';"
          new_import = "import { createCacheManifest, readPersistedManifestCounts, writeManifest, type ManifestHealthSummary } from './manifest.js';"
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one manifest import match, got {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          start_marker = "  const dsdbResourceArtifactCount = artifactRecords.filter((r) => r.kind === 'dsdb-resource').length;"
          end_marker = "\n\n  await runPromotionStep('manifest', 'write cache manifest'"
          if text.count(start_marker) != 1:
              raise SystemExit(f'Expected exactly one manifest block start, got {text.count(start_marker)}')
          start = text.index(start_marker)
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Manifest block end marker not found')

          new_block = "\n".join([
              "  const persistedManifestCounts = await readPersistedManifestCounts(cacheDir);",
              "  const buildManifest = (health: ManifestHealthSummary) => createCacheManifest({",
              "    baseUrl,",
              "    carbonVersion: carbonVersionForManifest,",
              "    siteMetaHash: siteMetaHashForManifest,",
              "    angularBundleHash: angularBundleHashForManifest,",
              "    sitemapHash: sitemapHashForManifest,",
              "    generatedAt: capturedAt,",
              "    counts: persistedManifestCounts,",
              "    health",
              "  });",
          ])
          text = text[:start] + new_block + text[end:]

          if text.count(new_import) != 1:
              raise SystemExit('Updated manifest import invariant failed')
          if text.count('const persistedManifestCounts = await readPersistedManifestCounts(cacheDir);') != 1:
              raise SystemExit('Persisted manifest count call invariant failed')
          if 'rawArtifacts: artifactRecords.length' in text:
              raise SystemExit('Old raw artifact operation count remains')
          if 'const dsdbResourceArtifactCount =' in text or 'const tokenTableCount =' in text:
              raise SystemExit('Old manifest count helper remains')

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/crawler.ts

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-manifest-crawler-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/crawler.ts .github/workflows/apply-manifest-crawler-patch.yml
          git commit -m "fix: derive crawler manifest counts from persisted owners"
          git push origin HEAD:fix/manifest-count-consistency
