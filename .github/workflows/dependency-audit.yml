name: Dependency audit

on:
  push:
    branches:
      - audit/dependency-security

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Runtime dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > runtime-audit.json
          runtime_status=$?
          cat runtime-audit.json
          echo "runtime_audit_exit=$runtime_status"
          exit 0
      - name: All dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > full-audit.json
          full_status=$?
          cat full-audit.json
          echo "full_audit_exit=$full_status"
          exit 0
