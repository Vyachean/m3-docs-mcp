name: Retry typography token fix

on:
  push:
    branches:
      - fix/typography-token-values

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typography-token-values

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source changes from canonical temporary workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-typography-token-fix.yml').read_text()
          marker = "          node <<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          NODE", start)
          body = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          Path('/tmp/apply-typography-fix.cjs').write_text(code)
          PY
          node /tmp/apply-typography-fix.cjs

      - run: npm ci
      - run: npx vitest run tests/typography-token-quality.test.ts tests/validate-structured-graph.test.ts tests/json-extraction.test.ts tests/token-resolution-classify.test.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:cache:full

      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/graph/token-table-graph.ts src/json-extraction/render-markdown.ts src/validation/validate-structured-graph.ts tests/validate-structured-graph.test.ts tests/typography-token-quality.test.ts
          git diff --cached --check
          git commit -m "fix: preserve current typography token values"
          git push origin HEAD:fix/typography-token-values
