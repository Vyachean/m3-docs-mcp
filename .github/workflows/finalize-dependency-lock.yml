name: Finalize dependency security refresh

on:
  push:
    branches:
      - audit/dependency-security

permissions:
  contents: write

concurrency:
  group: finalize-dependency-security-refresh
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/dependency-security
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Refresh vulnerable transitive versions within existing ranges
        shell: bash
        run: npm audit fix --package-lock-only || true
      - run: npm ci
      - name: Require clean runtime audit
        run: npm audit --omit=dev --audit-level=low
      - name: Allow only the known Stryker dev-chain residual
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync('npm', ['audit', '--json'], { encoding: 'utf8' });
          const report = JSON.parse(result.stdout);
          const names = Object.keys(report.vulnerabilities ?? {}).sort();
          const allowed = ['qs', 'typed-rest-client'];
          const unexpected = names.filter((name) => !allowed.includes(name));
          const badSeverity = names.filter((name) => report.vulnerabilities[name].severity !== 'moderate');
          if (unexpected.length || badSeverity.length || names.length !== allowed.length) {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          console.log('Only known dev-only Stryker residual remains:', names.join(', '));
          NODE
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit verified lock refresh
        shell: bash
        run: |
          rm -f .github/workflows/dependency-audit.yml \
                .github/workflows/dependency-lock-fix.yml \
                .github/workflows/dependency-residual-inspect.yml \
                .github/workflows/finalize-dependency-lock.yml
          if ! git diff --quiet -- package.json; then
            echo 'package.json changed unexpectedly' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows
          git commit -m "chore: refresh vulnerable dependency locks"
          git push origin HEAD:audit/dependency-security
