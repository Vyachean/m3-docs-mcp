name: Verify mutation runtime

on:
  push:
    branches:
      - fix/practical-verification-ci

concurrency:
  group: verify-mutation-runtime
  cancel-in-progress: true

jobs:
  json-extraction-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:json-extraction
